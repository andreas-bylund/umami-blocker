<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #134e4a 100%);
    }
    .row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    img { width: 72px; height: 72px; }
    h1 { font-size: 34px; color: #fff; }
    p {
      font-size: 17px;
      color: #99f6e4;
    }
  </style>
</head>
<body>
  <div class="row">
    <img src="../icons/icon128.png" alt="">
    <h1>Umami Blocker</h1>
  </div>
  <p>Your analytics, without you in them.</p>
</body>
</html>
