<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #ffffff;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      font-size: 15px;
      margin: 0;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex: none;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #d1d5db;
      border-radius: 11px;
      transition: background 0.15s;
      cursor: pointer;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    input:checked + .slider {
      background: #0d9488;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    #status {
      margin: 10px 0 0;
      color: #6b7280;
      font-size: 12px;
    }
    a {
      display: inline-block;
      margin-top: 12px;
      color: #0d9488;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="row">
    <h1>Umami Blocker</h1>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <p id="status"></p>
  <a href="#" id="openOptions">Manage domains →</a>
  <script src="popup.js"></script>
</body>
</html>
